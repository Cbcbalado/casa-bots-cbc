<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBC · Billeteras</title><meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#07090f;--card:#0f1420;--line:#1c2433;--tx:#e6ebf5;--mut:#7d8aa3;--g:#19d38a;--r:#ff5470;--a:#7c5cff;--y:#ffc94d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#16123a 0,transparent 60%),var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:16px 26px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#07090fe0;backdrop-filter:blur(10px);z-index:5}
.logo{font-weight:800;font-size:20px}.logo b{background:linear-gradient(90deg,var(--a),var(--g));-webkit-background-clip:text;color:transparent}
nav a{color:var(--mut);text-decoration:none;margin-left:14px;font-size:13px}nav a.on{color:var(--tx);font-weight:600}
.live{color:var(--mut);font-size:12px;display:flex;gap:8px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:var(--g)}
main{max-width:1320px;margin:auto;padding:22px;display:grid;gap:16px}
.c{background:linear-gradient(180deg,#111727,#0d1220);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
h2{margin:0 0 12px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi .v{font-size:28px;font-weight:800}.kpi .l{color:var(--mut);font-size:12px}
.wals{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1000px){.wals{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
.av{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--a);flex:none;background:#151b2b}.wt{display:flex;gap:12px;align-items:center}
.wh{display:flex;justify-content:space-between;align-items:flex-start}.wn{font-size:18px;font-weight:800}.sub{color:var(--mut);font-size:12px}
.big{font-size:30px;font-weight:800;margin:10px 0 2px}.up{color:var(--g)}.dn{color:var(--r)}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:#1a2235;color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{color:var(--mut);font-weight:500;font-size:11px;text-transform:uppercase}
td.n,th.n{text-align:right;white-space:nowrap}
.pill{font-weight:700;font-size:10.5px;padding:2px 8px;border-radius:6px;white-space:nowrap}
.t-Compra{background:#1a2b4a;color:#9db4ff}.t-Venta{background:#2a1f3d;color:#c9a8ff}.t-Interna{background:#13302a;color:#6ff0c0}.t-Depósito{background:#13302a;color:var(--g)}.t-Retiro{background:#3a1720;color:var(--r)}
.t-Perpetuos{background:#3a2f10;color:var(--y)}.t-Cambio{background:#1a2235;color:#cbd5e1}.t-Spam,.t-Polvo,.t-Otro{background:#151a26;color:#5d6880}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:#151b2b;border:1px solid var(--line);color:var(--mut);padding:7px 14px;border-radius:9px;cursor:pointer;font:inherit}.tabs button.on{color:var(--tx);border-color:var(--a);background:#1b1840}
label.chk{color:var(--mut);font-size:12px;margin-left:auto;display:flex;gap:6px;align-items:center}
.scroll{overflow:auto;max-height:620px}.empty{color:var(--mut);padding:14px;text-align:center}.mot{color:var(--mut);font-size:11.5px}
footer{color:var(--mut);text-align:center;font-size:11px;padding:20px}
</style></head><body>
<header><div class="logo">CBC <b>Trading</b> · Billeteras</div>
<nav><a href="./">Panel</a><a class="on" href="billeteras.html">Billeteras</a></nav>
<div class="live"><span class="dot"></span><span id="gen">cargando…</span></div></header>
<main>
<section class="c"><h2>Resumen total · <span id="nw">4</span> billeteras</h2><div class="kpis" id="kpis"></div><div class="sub" id="nota" style="margin-top:10px"></div></section>
<section class="wals" id="wals"></section>
<section class="c"><h2>Estado de cuenta</h2>
<div class="tabs" id="tabs"></div><div class="scroll" id="est"></div></section>
</main>
<footer>Datos on-chain (RPC pública de Solana) + precios de Jupiter, cruzados con los registros de los bots. Direcciones y firmas acortadas a propósito. Se actualiza solo.</footer>
<script>
const $=id=>document.getElementById(id),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const usd=(v,s)=>v==null?"—":(s&&v>0?"+":"")+(v<0?"-":"")+"$"+Math.abs(v).toLocaleString("es",{minimumFractionDigits:2,maximumFractionDigits:2});
const cl=v=>v>0?"up":v<0?"dn":"";const num=(v,d=4)=>v==null?"—":(+v).toLocaleString("es",{maximumFractionDigits:d});
let D=null,sel=null,todo=false;
function pct(a,b){return b?((a/b-1)*100).toFixed(1)+"%":""}
function render(){
 const T=D.total;$("nw").textContent=D.billeteras.length;$("gen").textContent="Actualizado "+D.generado+" · SOL $"+D.precio_sol;
 $("kpis").innerHTML=[["Valor total",usd(T.valor_usd),""],["Capital neto aportado",usd(T.neto_invertido_usd),""],
  ["Ganancia / pérdida total",usd(T.pnl_usd,1),cl(T.pnl_usd)],["Resultado de operaciones cerradas",usd(T.pnl_realizado_usd,1),cl(T.pnl_realizado_usd)]]
  .map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v ${k[2]}">${k[1]}</div></div>`).join("");
 $("nota").textContent="Capital neto aportado = depósitos reales del usuario − retiros ($210.58 hasta el 20 oct + $122.85 el 21 oct). Resultado total = valor actual de las 4 billeteras − capital aportado. Los montos por billetera son estimaciones de su ventana de seguimiento."+(D.incompleto?` ⚠ ${D.incompleto} transacción(es) aún sin leer.`:"");
 $("wals").innerHTML=D.billeteras.map(w=>{
  const act=w.activos.filter(a=>!a.polvo).map(a=>`<div class="row"><span>${E(a.activo)}</span><span>${num(a.cantidad)} · <b>${usd(a.usd)}</b></span></div>`).join("");
  const polvo=w.activos.filter(a=>a.polvo).length;
  let pos=w.abiertas.length?w.abiertas.map(p=>`<div class="row"><span>${E(p.token)}</span><span class="${cl(p.cambio)}">${p.cambio==null?"—":(p.cambio>0?"+":"")+p.cambio+"%"}</span></div>`).join(""):"";
  if(w.perps)pos+=w.perps.map(p=>`<div class="row"><span>${E((p.lado||"").toUpperCase())} ${E(p.mercado)} ${num(p.apalancamiento,2)}x · tamaño $${num(p.tamano_usd,2)} · entrada ${num(p.entrada,2)} · liq. ${num(p.liq,2)}</span><span class="${cl(p.pnl_usd)}">${usd(p.pnl_usd,1)}</span></div>`).join("");
  return `<div class="c"><div class="wh"><div class="wt"><img class="av" src="${E(w.img||("img/"+w.id+".jpg"))}?v=${D.generado_ts}" alt="" onerror="this.remove()"><div><div class="wn">${E(w.nombre)}</div><div class="sub">${E(w.rol)}</div></div></div><span class="tag">${E(w.dir)}</span></div>
  <div class="big">${usd(w.valor_usd)}</div>
  <div class="sub">Aportado ${usd(w.neto_invertido_usd)} · <b class="${cl(w.pnl_usd)}">${usd(w.pnl_usd,1)}</b> ${w.neto_invertido_usd>0?`(${(w.pnl_usd/w.neto_invertido_usd*100).toFixed(1)}%)`:""} · ${E(w.ventana)}</div>
  <div class="sub" style="margin:4px 0 12px">Operaciones cerradas: ${w.cerradas} (${w.ganadas} ganadas) · resultado ${usd(w.pnl_realizado_usd,1)}</div>
  <h2>Saldos</h2>${act}${polvo?`<div class="sub" style="padding-top:6px">+ ${polvo} token(s) de polvo sin valor</div>`:""}
  <h2 style="margin-top:14px">Posiciones abiertas</h2>${pos||'<div class="empty">Ninguna</div>'}</div>`}).join("");
 if(!sel)sel=D.billeteras[0].id;
 $("tabs").innerHTML=D.billeteras.map(w=>`<button class="${w.id==sel?"on":""}" onclick="sel='${w.id}';render()">${E(w.nombre)}</button>`).join("")+`<label class="chk"><input type="checkbox" ${todo?"checked":""} onchange="todo=this.checked;render()"> mostrar spam y polvo</label>`;
 const w=D.billeteras.find(x=>x.id==sel),R=w.estado.filter(e=>todo||!["Spam","Polvo","Otro"].includes(e.tipo));
 $("est").innerHTML=R.length?`<table><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th class="n">SOL</th><th class="n">Monto</th><th class="n">Ganancia</th><th>Tx</th></tr>${R.map(e=>`<tr><td style="white-space:nowrap">${E(e.hora)}</td><td><span class="pill t-${E(e.tipo)}">${E(e.tipo)}</span></td><td>${E(e.detalle)}${e.motivo?`<div class="mot">${E(e.motivo)}</div>`:""}</td><td class="n ${cl(e.sol)}">${e.sol>0?"+":""}${num(e.sol,5)}</td><td class="n">${e.tipo=="Spam"?"—":usd(Math.abs(e.usd))}</td><td class="n ${cl(e.pnl_usd)}">${e.pnl_usd==null?"":usd(e.pnl_usd,1)+`<div class="mot">${e.pnl_sol>0?"+":""}${e.pnl_sol} SOL</div>`}</td><td class="mot">${E(e.firma)}</td></tr>`).join("")}</table>`:'<div class="empty">Sin movimientos todavía</div>';
}
async function load(){try{const r=await fetch("data/billeteras.json?t="+Date.now());D=await r.json();render()}catch(e){$("gen").textContent="sin conexión, reintentando…"}}
load();setInterval(load,60000);
</script></body></html>
